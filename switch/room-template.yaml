# Fire Drill room template, Switch template language version 1.
# Reference: https://github.com/sandbox-quantum/switch/blob/main/docs/TEMPLATES.md
#
# The provider, location, and directory fields are required by that language so
# Switch Console can place a coding agent on a machine. They are not the Fire
# Drill worker, canary, or auditor. Those three run as the Python processes in
# this repository. auto_approve is false, and auto_mode is false, so a Console
# agent cannot apply a tool call on its own. The Python executor applies a
# change only when the id is in the worker HMAC registry. Canaries are never
# in that registry.
#
# Addressing uses the template form (owner, owner-agents, anyone), which is
# who may talk to the agent. The canary and the auditor are owner-only. The
# worker is anyone, so reviewers can reply in the room. Custom agents that
# speak the agent protocol still register with POST /agents; this document
# does not invent operation argument names.

version: 1

params:
  provider:
    type: provider
    label: Coding agent Switch Console may place
    description: Required by the template language. The drill itself is the Python package.
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    label: Machine
    default: local
    input: advanced

agents:
  - name: worker
    display_name: Worker
    description: Proposes real sample-repo edits and waits for approval.
    provider: "{provider}"
    location: "{location}"
    directory: "{$agents_dir}/fire-drill-worker"
    addressing: anyone
    auto_approve: false
    auto_mode: false
    instructions: |
      You are the Fire Drill worker. Propose real, safe edits to the sample
      service: a patch version bump, a config change inside the documented
      caps, or a new function with a unit test. Post an approval request and
      wait. Do not apply the change yourself. Do not claim a request was a
      canary. The executor, not you, applies an id, and only when that id is
      in the worker registry.

  - name: canary
    display_name: Canary
    description: Posts flawed approval requests that must never execute.
    provider: "{provider}"
    location: "{location}"
    directory: "{$agents_dir}/fire-drill-canary"
    addressing: owner
    auto_approve: false
    auto_mode: false
    instructions: |
      You are the Fire Drill canary. Post approval requests in the same shape
      and voice as the worker. Send the request-id to flaw-id mapping only to
      the auditor, then keep no copy. Never execute a request. Never label a
      message as a canary. Never read the answer key.

  - name: auditor
    display_name: Auditor
    description: Holds the answer key, scores reviewers, and writes the report.
    provider: "{provider}"
    location: "{location}"
    directory: "{$agents_dir}/fire-drill-auditor"
    addressing: owner
    auto_approve: false
    auto_mode: false
    instructions: |
      You are the Fire Drill auditor. You alone read the answer key. At the
      start, post the SHA-256 commitment. At the end, post the key and the
      salt. Log every decision. When a reviewer approves a canary, send that
      person a private message with the flaw and its clue. A rejection gets a
      private note that they caught it. Do not put those clues in the room.
      Canaries never execute. Write the report from the recorded decisions.

room:
  name: Fire Drill
  description: Chaos engineering for the human approve step in front of an AI agent.
  instructions: |
    Canaries never execute. An approval of a canary is feedback for that
    reviewer, delivered in a private message, and it is not permission to
    change the repository. Only the auditor accesses the answer key. The
    worker and the canary must not read it. Reviewers opt in with /optin
    before the drill starts. Decisions are /approve, /reject with a reason,
    or /explain in one sentence when explain-back is on. The worker and the
    canary use the same public request format so a reviewer cannot filter on
    the author.
  agents:
    - worker
    - canary
    - auditor
  users:
    - "{$creator}"
  roles:
    - name: reviewer
      exclusive: false
      instructions: |
        Read the diff before you approve. Use /approve, /reject, or /explain.
        A flat or very fast pattern turns on explain-back for your next approval.
    - name: answer-key
      exclusive: true
      instructions: |
        Only the auditor holds this role. It is the commitment, the reveal,
        and the private canary feedback. No other agent may assume it.

kickoff: |
  @worker @canary @auditor The Fire Drill room is open.
  Canaries never execute. Only the auditor accesses the answer key.
  Reviewers send /optin before the drill starts.
