# Read-only public dashboard of an offline Fire Drill run.
# Publishes the committed public/ folder. The answer key is never published.
services:
  - type: web
    name: fire-drill
    runtime: static
    repo: https://github.com/aneek22112007-tech/fire-drill
    branch: main
    # Use the committed dashboard; Render's static builder has no Python 3.12 for uv.
    buildCommand: "true"
    staticPublishPath: public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

  # Live API + site (FastAPI). Free plan: sleeps after 15 min idle, ~1 min wake,
  # ephemeral disk (run history resets on restart/redeploy/spin-down).
  # Not created until this Blueprint is synced in the Render dashboard.
  - type: web
    name: fire-drill-live
    runtime: python
    plan: free
    repo: https://github.com/aneek22112007-tech/fire-drill
    branch: main
    buildCommand: "pip install -e ."  # editable: code reads public/, canaries/, sample_repo/ from the repo
    startCommand: "firedrill web --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: XAI_API_KEY        # set in the dashboard; never commit
        sync: false
      - key: XAI_MODEL
        value: grok-4.7
      - key: FIREDRILL_ADMIN_TOKEN
        generateValue: true
      - key: FIREDRILL_DATA_DIR
        value: /tmp/firedrill-live
      - key: FIREDRILL_MAX_RUNS_PER_DAY
        value: "10"
      - key: FIREDRILL_RUN_COOLDOWN_SECONDS
        value: "60"
      - key: LLM_MAX_CALLS_PER_RUN
        value: "60"
      - key: LLM_MAX_TOKENS
        value: "200"
