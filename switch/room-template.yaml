# Fire Drill room. Switch template language version 1.
# Reference: https://github.com/sandbox-quantum/switch/blob/main/docs/TEMPLATES.md
# Agent join steps: https://docs.switchagents.ai/switch-rooms/internals/agent-protocol
#
# This document creates a room, its roles, and its instructions. It does not
# create agents. The template language requires provider, location or machine,
# and directory only for agents a template creates, and those fields place a
# Console coding agent (claude, codex, opencode, antigravity, cursor). The
# worker, canary, and auditor are external Fire Drill processes, so those
# fields are absent on purpose. A run stops if the three names below are not
# already registered on the server.
#
# Join each bot once, before you use this template. Do not call
# POST /agents/register-known. That route registers only the agent types
# Switch Console runs.
#
# 1. Create a registration API key on the Gateway API Keys page. The person
#    who creates it becomes the bot's owner.
# 2. POST /agents with that key as Authorization: Bearer. Required body
#    fields are name, description, connector_type, and integration_profile.
#    integration_profile requires connection_model, message_exchange, and
#    pre_invocation_mediation, post_invocation_mediation, and event_reporting
#    (send [] for those three unless you need them). Names must match
#    ^[a-z0-9][a-z0-9._-]*$ : worker, canary, auditor. The response is
#    {id, api_key} and the API key is returned once.
#    This repo's adapter does not open the WebSocket, so connection_model
#    session_passive matches an agent that reads room context when it polls.
#    message_exchange is true.
# 3. A new agent answers its owner and nobody else. Leave the canary and the
#    auditor there. For the worker, call update_agent_detail with the bot's
#    own API key (no connection id is required):
#    POST /agents/{agent_id}/ops/update_agent_detail
#    {"agent_id": "<agent_id>", "addressing": "anyone"}
#    The protocol values are owner_only, owner_and_owner_agents, and anyone.
#    The template words owner, owner-agents, and anyone apply to agents the
#    template creates. This document creates none.
# 4. Use this template. room.agents names the three bots. Switch adds those
#    existing agents. It does not install a provider or a directory for them.
#
# None of these calls were made against a live Switch server from this repo.

version: 1

room:
  name: Fire Drill
  description: Chaos engineering for the human approve step in front of an AI agent.
  instructions: |
    Canaries never execute. An approval of a canary is feedback for that
    reviewer, delivered in a private message, and it is not permission to
    change the repository. Only the auditor accesses the answer key. The
    worker and the canary must not read it. Reviewers opt in with /optin
    before the drill starts. Decisions are /approve, /reject with a reason,
    or /explain in one sentence when explain-back is on. The worker and the
    canary use the same public request format so a reviewer cannot filter on
    the author.
    Addressing is set on each bot when it registers, not in this room. The
    worker answers anyone. The canary and the auditor answer their owner only.
  agents:
    - worker
    - canary
    - auditor
  users:
    - "{$creator}"
  roles:
    - name: reviewer
      exclusive: false
      instructions: |
        Read the diff before you approve. Use /approve, /reject, or /explain.
        A flat or very fast pattern turns on explain-back for your next approval.
    - name: answer-key
      exclusive: true
      instructions: |
        Only the auditor holds this role. It is the commitment, the reveal,
        and the private canary feedback. No other agent may assume it.

kickoff: |
  @worker @canary @auditor The Fire Drill room is open.
  Canaries never execute. Only the auditor accesses the answer key.
  Reviewers send /optin before the drill starts.
