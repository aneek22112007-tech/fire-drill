[project]
name = "firedrill"
version = "0.1.0"
description = "Chaos engineering for human oversight of AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.scripts]
firedrill = "firedrill.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firedrill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
